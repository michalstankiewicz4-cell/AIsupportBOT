# Konfiguracja Cloudflare Workera — pośrednika asystenta "ai".
# Wdrożenie z tego folderu:  npx wrangler deploy
# Klucz API ustaw raz:       npx wrangler secret put ANTHROPIC_API_KEY
name = "lekarze-ai-assistant"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Strony, które mogą wywoływać Workera (po przecinku, bez ukośnika na końcu).
ALLOWED_ORIGINS = "https://lekarzeiterapeuci.pl,https://www.lekarzeiterapeuci.pl,https://michalstankiewicz4-cell.github.io"
# Opcjonalnie: zmiana modelu.
# MODEL = "claude-haiku-5-5"
# Czas życia cache promptu: "5m" (domyślnie, tańszy zapis) lub "1h" (lepsze przy małym ruchu).
# CACHE_TTL = "1h"
# Sekret Turnstile ustawia się jako sekret, nie tutaj:  npx wrangler secret put TURNSTILE_SECRET_KEY
