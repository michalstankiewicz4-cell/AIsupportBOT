# Prosty workflow publikujący statyczną stronę na GitHub Pages
name: Deploy static content to Pages

on:
  # Uruchamia się przy pushu na gałąź domyślną
  push:
    branches: ["main"]

  # Pozwala uruchomić workflow ręcznie z zakładki Actions
  workflow_dispatch:

# Uprawnienia GITHUB_TOKEN potrzebne do publikacji na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tylko jedno wdrożenie naraz; uruchomienia czekające w kolejce między trwającym a najnowszym są pomijane.
# Trwających wdrożeń NIE przerywamy — produkcyjne wdrożenie ma się dokończyć.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Jedno zadanie — tylko publikujemy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Strażnik: nie publikuj, jeśli wersje/CHANGES/model się rozjechały albo testy nie przechodzą.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version check
        run: node tools/check-versions.js
      - name: Tests
        run: node --no-warnings tools/test.js
      # Panel administratora NIE jest publikowany — działa tylko lokalnie (npm run panel).
      # Kod serwerów (Workery) też nie jest potrzebny na stronie.
      - name: Remove private parts from the public site
        run: rm -rf panel/admin panel/server ai/server tools
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Wysyłamy całe repozytorium
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
